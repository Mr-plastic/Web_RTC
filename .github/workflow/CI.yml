name: CI for Web_RTC

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: get_original_code
        uses: actions/checkout@v3

      - name: set_envrionment 
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: install_package
        run: |
          cd backend
          npm install

      - name: run_test
        run: |
          cd backend
          npm test

